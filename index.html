
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Tracksy | Mounjaro & Weight Tracker</title>

    <meta
      name="description"
      content="Track your Mounjaro injections, doses, weight progress, and milestones in one simple app. Stay organized and see how far you've come."
    />

    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Tracksy" />
    <meta name="author" content="Tracksy" />

    <link
      rel="canonical"
      href="https://mounjaro-tracksy.vercel.app/"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#F7F7F2"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0C1513"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-title" content="Tracksy" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Tracksy | Mounjaro & Weight Tracker"
    />
    <meta
      property="og:description"
      content="Track your Mounjaro injections, doses, weight progress, and milestones in one simple app. Stay organized and see how far you've come."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://mounjaro-tracksy.vercel.app/"
    />
    <meta property="og:site_name" content="Tracksy" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:image"
      content="https://mounjaro-tracksy.vercel.app/og-image.png"
    />
    <meta
      property="og:image:alt"
      content="Tracksy weight and injection tracking app preview"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Tracksy | Mounjaro & Weight Tracker"
    />
    <meta
      name="twitter:description"
      content="Track your Mounjaro injections, doses, weight progress, and milestones in one simple app. Stay organized and see how far you've come."
    />
    <meta
      name="twitter:image"
      content="https://mounjaro-tracksy.vercel.app/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Tracksy weight and injection tracking app preview"
    />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/tracksy_favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Tracksy",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web",
        "url": "https://mounjaro-tracksy.vercel.app/",
        "description": "Track your Mounjaro injections, doses, weight progress, and milestones in one simple app. Stay organized and see how far you've come.",
        "image": "https://mounjaro-tracksy.vercel.app/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "SEK"
        }
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to use Tracksy.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
